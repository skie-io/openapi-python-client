[tool.poetry]
name = "my-test-api-client"
version = "0.1.0"
description = "A client library for accessing My Test API"

authors = []

readme = "README.md"
packages = [
    {include = "my_test_api_client"},
]
include = ["CHANGELOG.md", "my_test_api_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.23.0,<0.29.0"
attrs = ">=21.3.0"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
orjson = "^3.9.7"
ormsgpack = "^1.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target_version = ['py311', 'py312', 'py313', 'py314', 'py315']
exclude = '''
(
  /(
    | \.git
    | \.venv
    | \.mypy_cache
  )/
)
'''

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]
