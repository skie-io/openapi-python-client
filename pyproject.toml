[tool.poetry]
name = "openapi-python-client"
version = "0.15.2"
description = "Generate modern Python clients from OpenAPI"
repository = "https://github.com/triaxtec/openapi-python-client"
license = "MIT"
keywords=["OpenAPI", "Client", "Generator"]
authors = ["Dylan Anthony <danthony@triaxtec.com>"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
readme = "README.md"
packages = [
    {include = "openapi_python_client"},
]
include = ["CHANGELOG.md", "openapi_python_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
jinja2 = "^3.0.0"
typer = ">0.6, <0.26"  # safety requires typer < 0.26
colorama = {version = "^0.4.3", markers = "sys_platform == 'win32'"}
shellingham = "^1.3.2"
black = ">=26.5"
pydantic = "^2.1.1"
attrs = ">=21.3.0"
httpx = ">=0.23.0,<0.29.0"
PyYAML = "^6.0"
ruff = "^0.17.1"
typing-extensions = "^4.8.0"

[tool.poetry.scripts]
openapi-python-client = "openapi_python_client.cli:app"

[tool.poetry.dev-dependencies]
pytest = "*"
pytest-mock = "*"
mypy = "*"
taskipy = "*"
safety = "*"
pytest-cov = "*"
python-multipart = "*"
types-PyYAML = "^6.0.3"
pylint = ">=2.15.5"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
orjson = "^3.9.7"
ormsgpack = "^1.4.0"

[tool.taskipy.tasks]
check = """
ruff check --fix . \
 && black .\
 && poetry export -f requirements.txt | poetry run safety check --bare --stdin\
 && mypy openapi_python_client\
 && TASKIPY=true pytest --cov openapi_python_client tests --cov-report=term-missing --basetemp=tests/tmp\
 && rm -r tests/tmp\
"""
regen = """
task regen_e2e\
&& task regen_integration\
"""
e2e = "pytest openapi_python_client end_to_end_tests/test_end_to_end.py"
re = """
task regen\
&& task e2e\
"""
regen_e2e = "python -m end_to_end_tests.regen_golden_record"
regen_integration = """
openapi-python-client update --url https://raw.githubusercontent.com/openapi-generators/openapi-test-server/35f0d632d0e1860046ba18aac8351928fe3bd5bd/openapi.json --config integration-tests-config.yaml\
&& mypy integration-tests --strict
"""

[tool.black]
line-length = 120
target_version = ['py311', 'py312', 'py313', 'py314', 'py315']
exclude = '''
(
  /(
    | \.git
    | \.venv
    | env
    | \.mypy_cache
    | openapi_python_client/templates
    | tests/test_templates
    | end_to_end_tests/test_custom_templates
    | end_to_end_tests/golden-record-custom
  )/
)
'''

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["tests/test_templates/test_property_templates/test_date_property/*", "end_to_end_tests/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL", "RUF"]
ignore = ["E501", "PLC0415", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"openapi_python_client/cli.py" = ["B008"]

[tool.coverage.run]
omit = ["openapi_python_client/templates/*"]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_any_generics = true
disallow_untyped_defs = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "importlib_metadata",
    "typer",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
junit_family = "xunit2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
